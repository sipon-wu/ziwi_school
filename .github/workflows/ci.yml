name: CI

# 安全闸门：push 到 main 或开 PR 时自动跑 build/lint/typecheck/test。
# 注意：本流程只验证代码可编译/可构建，绝不自动部署（部署仍走 deploy.sh 手动触发）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go build / vet / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: code/backend/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # 蒸馏底座守门：确保 ensureDistillSchema 既被定义又被调用。
      # 历史根因：蒸馏层曾不在代码管线，建表逻辑被删/未接 →
      # 部署后 tb_lesson_source/tb_lesson_lecture 建不出，RAG 无素材却测试全绿（假绿）。
      # 此静态检查拦「代码回归」，真·数据非空断言见 qa/verify_distill_base.cjs（需 SSH CVM，CI runner 不跑）。
      - name: Distill schema guard
        run: |
          MAIN=cmd/server/main.go
          grep -q "func ensureDistillSchema" "$MAIN" || { echo "FAIL: ensureDistillSchema 未定义"; exit 1; }
          grep -q "ensureDistillSchema(db)" "$MAIN" || { echo "FAIL: ensureDistillSchema 未被调用"; exit 1; }
          echo "OK: ensureDistillSchema 已定义并被调用"

  frontend:
    name: Frontend (lint / typecheck / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
