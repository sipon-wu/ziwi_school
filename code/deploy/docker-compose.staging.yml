# 知微教学平台 · 测试环境 (staging)
# 与 prod 完全隔离的独立栈：独立 postgres / redis / backend / ai-service
# 代码同源（同一份 backend/ai-service 源码构建）
services:
  postgres-staging:
    image: pgvector/pgvector:pg16
    container_name: zhiwei-postgres-staging
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits: { memory: 512M }

  redis-staging:
    image: redis:7-alpine
    container_name: zhiwei-redis-staging
    restart: always
    volumes:
      - redis_data_staging:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  backend-staging:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: zhiwei-backend-staging
    restart: always
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres-staging:5432/${DB_NAME}?sslmode=disable
      REDIS_URL: redis://redis-staging:6379/0
      JWT_SECRET: ${JWT_SECRET}
      AI_BASE_URL: http://ai-service-staging:8000
      HEARTBEAT_ENABLED: ${HEARTBEAT_ENABLED}
      HEARTBEAT_API_KEY: ${HEARTBEAT_API_KEY}
      HEARTBEAT_URL: ${HEARTBEAT_URL}
    depends_on:
      postgres-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  ai-service-staging:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: zhiwei-ai-staging
    restart: always
    environment:
      AI_PORT: "8000"
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL}
      # ── LLM 通道（2026-09-12 统一为 OpenAI 兼容协议；换厂商只改这里，不改代码）──
      # 换 DeepSeek 示例：
      #   LLM_BASE_URL=https://api.deepseek.com/v1
      #   LLM_API_KEY=<deepseek key>
      #   LLM_MODEL=deepseek-chat
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # 分工模型：生成器优先给算力；红线复核**最好与生成器不同厂商**（否则没有交叉验证意义）
      CW_GEN_MODEL: ${CW_GEN_MODEL:-qwen-turbo}
      CW_REVIEW_MODEL: ${CW_REVIEW_MODEL:-qwen-turbo}
      CW_SAFETY_MODEL: ${CW_SAFETY_MODEL:-qwen-turbo}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres-staging:5432/${DB_NAME}?sslmode=disable
      REDIS_URL: redis://redis-staging:6379/1
    volumes:
      - /opt/zhiwei/data:/data:ro
    depends_on:
      postgres-staging:
        condition: service_healthy
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

volumes:
  postgres_data_staging:
  redis_data_staging:
