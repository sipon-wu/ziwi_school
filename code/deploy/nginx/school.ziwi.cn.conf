# 知微AI教学助手 · school.ziwi.cn
# 由宿主机 nginx 托管前端 dist 并反代 /api 到 backend 容器(127.0.0.1:8080)
# 部署时 scp 到 /etc/nginx/sites-enabled/school.ziwi.cn 并 reload

server {
    listen 80;
    server_name school.ziwi.cn;
    # HTTP 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name school.ziwi.cn;

    ssl_certificate     /etc/nginx/ssl/school/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/school/school.ziwi.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 前端静态资源（dist 上传至 /var/www/school.ziwi.cn）
    root /var/www/school.ziwi.cn;
    index index.html;

    # SPA 兜底：非文件请求回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
