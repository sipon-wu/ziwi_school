# 知微AI教学助手 · 测试环境 school1.ziwi.cn (HTTP, 无需证书)
# 部署时 scp 到 /etc/nginx/sites-enabled/school1.ziwi.cn 并 reload

server {
    listen 80;
    server_name school1.ziwi.cn;

    # 前端静态资源（dist 上传至 /var/www/school1.ziwi.cn）
    root /var/www/school1.ziwi.cn;
    index index.html;

    # SPA 兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代到 staging backend (:8081)
    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 2026-09-12：60s → 300s。
        # 原因：课件生成是**同步长任务**（1~3 次生成 + 发散地图 + 红线复核）。
        # · qwen-turbo  ≈ 30~40s（贴着 60s 上限，已经危险）
        # · qwen-plus   ≈ 150~200s（更强模型必然超时 → 504 Gateway Time-out）
        # 即"分钟级生成"这个产品目标与 60s 网关**本质矛盾**。
        # 300s 只是临时放开以完成模型对照；**根治方案是异步化**（任务队列 + 轮询/SSE），
        # 而不是一直靠抬超时硬扛长连接。
        proxy_read_timeout 300s;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:8081/health;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
