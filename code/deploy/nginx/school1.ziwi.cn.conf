# 知微AI教学助手 · 测试环境 school1.ziwi.cn (HTTP, 无需证书)
# 部署时 scp 到 /etc/nginx/sites-enabled/school1.ziwi.cn 并 reload

server {
    listen 80;
    server_name school1.ziwi.cn;

    # 前端静态资源（dist 上传至 /var/www/school1.ziwi.cn）
    root /var/www/school1.ziwi.cn;
    index index.html;

    # SPA 兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代到 staging backend (:8081)
    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:8081/health;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
